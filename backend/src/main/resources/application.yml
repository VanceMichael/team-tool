server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/standup_checkin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: standup-checkin-jwt-secret-key-2024-very-long-secret
  expiration: 86400000

app:
  edit-window-minutes: 60
